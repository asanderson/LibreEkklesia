[project]
name = "libreekklesia"
version = "0.0.0"
description = "Free and open source church management website."
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "django-allauth>=65.22.1,<65.23.0",
    "django-ninja>=1.8.0,<1.9.0",
    "django-tasks-db>=0.13.0,<0.13.1",
]

[tool.uv]
required-version = "==0.11.32"
package = false
exclude-newer = "7 days"
add-bounds = "minor"

[dependency-groups]
dev = [
    "pytest>=9.2.0,<9.3.0",
    "pytest-django>=4.14.0,<4.15.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
