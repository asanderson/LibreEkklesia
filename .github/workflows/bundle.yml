# Builds both images, runs the backend tests inside the web image, starts the bundle with
# Docker Compose and checks it from the outside (deploy/smoke_test.py). Task P0-09.
name: Bundle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run the backend tests inside the web image
        run: docker build --file deploy/web.Dockerfile --target test .

      - name: Write a throwaway .env
        run: |
          {
            echo "LIBREEKKLESIA_HOST=localhost"
            echo "DJANGO_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')"
          } > .env

      - name: Start the bundle
        run: docker compose up --build --detach

      - name: Check the bundle from the outside
        run: python3 deploy/smoke_test.py

      - name: Show the logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the bundle
        if: always()
        run: docker compose down --volumes
